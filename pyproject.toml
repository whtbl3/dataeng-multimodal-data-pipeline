[project]
name = "talk-align"
version = "0.1.0"
description = "Batch pipeline: talk video -> time-aligned, quality-scored audio and slide records in DuckDB"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "av<19", # av 19 removed metadata_errors used by faster-whisper 1.2.1.
    "duckdb>=1.5.6",
    "faster-whisper>=1.2.1",
    "pyarrow>=26.0.0",
    "pydantic>=2.14.1",
    "rapidocr-onnxruntime>=1.4.4",
]

[project.scripts]
talk-align = "talk_align.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: end-to-end on the real video (minutes); run with `pytest -m slow`"]
addopts = "-m 'not slow'"

[dependency-groups]
dev = [
    "pyrefly>=1.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
